<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>404 — Página no encontrada</title>
<link rel="icon" type="image/png" href="favicon.png">
<link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Rajdhani:wght@700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Share Tech Mono',monospace;background:#020408;color:#e8f4ff;min-height:100vh;display:flex;align-items:center;justify-content:center;flex-direction:column;overflow:hidden;position:relative}
body::before{content:'';position:fixed;inset:0;background:repeating-linear-gradient(0deg,transparent,transparent 2px,rgba(0,0,0,.07) 2px,rgba(0,0,0,.07) 4px);pointer-events:none;z-index:2}
.code{font-family:'Rajdhani',sans-serif;font-weight:700;font-size:clamp(100px,20vw,200px);color:transparent;-webkit-text-stroke:2px #00eeff;text-shadow:0 0 60px rgba(0,238,255,.3);line-height:1;position:relative}
.code::after{content:'404';position:absolute;inset:0;color:rgba(255,32,144,.15);transform:translate(4px,4px);-webkit-text-stroke:1px rgba(255,32,144,.3)}
.msg{font-size:12px;color:#3d5570;letter-spacing:.2em;text-transform:uppercase;margin:20px 0 40px}
.btn{font-family:'Share Tech Mono',monospace;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:#020408;background:#00eeff;padding:13px 30px;text-decoration:none;position:relative;overflow:hidden;transition:box-shadow .25s;box-shadow:0 0 20px rgba(0,238,255,.25)}
.btn:hover{box-shadow:0 0 40px rgba(0,238,255,.6),0 0 80px rgba(0,238,255,.2)}
.glow{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:400px;height:400px;background:radial-gradient(ellipse,rgba(0,238,255,.04),transparent 70%);pointer-events:none}
</style>
</head>
<body>
<div class="glow"></div>
<div class="code">404</div>
<div class="msg">// segmento no encontrado en la matrix</div>
<a href="index.html" class="btn">← Volver al inicio</a>
</body>
</html>
